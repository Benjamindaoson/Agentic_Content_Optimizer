# Growth Flywheel 2.5 — Production (Tencent Cloud Lighthouse)
#
# 生产部署：无 GPU，单节点，Nginx 反代
# 启动: docker compose -f docker-compose.prod.yml up -d
# 停止: docker compose -f docker-compose.prod.yml down

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gf-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: growth_flywheel
      POSTGRES_USER: growth_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gf-prod

  redis:
    image: redis:7-alpine
    container_name: gf-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gf-prod

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gf-prod-qdrant
    restart: unless-stopped
    volumes:
      - prod_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gf-prod

  minio:
    image: minio/minio:latest
    container_name: gf-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gf-prod

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: growth-flywheel-api:prod
    container_name: gf-prod-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 4
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://growth_user:${POSTGRES_PASSWORD}@postgres:5432/growth_flywheel
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gf-prod

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: growth-flywheel-api:prod
    container_name: gf-prod-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://growth_user:${POSTGRES_PASSWORD}@postgres:5432/growth_flywheel
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    depends_on:
      - api
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gf-prod

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: growth-flywheel-api:prod
    container_name: gf-prod-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://growth_user:${POSTGRES_PASSWORD}@postgres:5432/growth_flywheel
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - gf-prod

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_qdrant_data:
  prod_minio_data:

networks:
  gf-prod:
    driver: bridge
