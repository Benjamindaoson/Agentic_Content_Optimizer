# Growth Flywheel 2.5 — Production (Tencent Cloud Lighthouse)
#
# 生产部署：无 GPU，单节点，Nginx 反代
# 启动: docker compose -f docker-compose.prod.yml up -d
# 停止: docker compose -f docker-compose.prod.yml down

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gf-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: growth_flywheel
      POSTGRES_USER: growth_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gf-prod

  redis:
    image: redis:7-alpine
    container_name: gf-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gf-prod

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gf-prod-qdrant
    restart: unless-stopped
    volumes:
      - prod_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gf-prod

  minio:
    image: minio/minio:latest
    container_name: gf-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gf-prod

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: growth-flywheel-api:prod
    container_name: gf-prod-api
    restart: unless-stopped
    # Active multimodal jobs currently use an in-process execution lease.
    # Keep one API worker until execution is moved to the distributed queue.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://growth_user:${POSTGRES_PASSWORD}@postgres:5432/growth_flywheel
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
      RUNWAYML_API_BASE: ${RUNWAYML_API_BASE:-https://api.dev.runwayml.com}
      RUNWAYML_API_VERSION: ${RUNWAYML_API_VERSION:-2024-11-06}
      RUNWAYML_MODEL: ${RUNWAYML_MODEL:-gen4.5}
      RUNWAYML_RATIO: ${RUNWAYML_RATIO:-720:1280}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_API_BASE: ${ELEVENLABS_API_BASE:-https://api.elevenlabs.io}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      MULTIMODAL_ARTIFACT_DIR: ${MULTIMODAL_ARTIFACT_DIR:-/app/runtime/multimodal}
      MULTIMODAL_DURABLE_STORAGE_ENABLED: ${MULTIMODAL_DURABLE_STORAGE_ENABLED:-true}
      MULTIMODAL_ARTIFACT_BUCKET: ${MULTIMODAL_ARTIFACT_BUCKET:-videos}
      MULTIMODAL_LLM_PROVIDER: ${MULTIMODAL_LLM_PROVIDER:-claude}
      MULTIMODAL_LLM_MODEL: ${MULTIMODAL_LLM_MODEL:-}
      MULTIMODAL_JUDGE_ENABLED: ${MULTIMODAL_JUDGE_ENABLED:-false}
      MULTIMODAL_JUDGE_MODEL: ${MULTIMODAL_JUDGE_MODEL:-gpt-5.6-luna}
      MULTIMODAL_JUDGE_SAMPLE_COUNT: ${MULTIMODAL_JUDGE_SAMPLE_COUNT:-4}
      MULTIMODAL_SUBTITLES_ENABLED: ${MULTIMODAL_SUBTITLES_ENABLED:-true}
      MULTIMODAL_BRAND_TEXT: ${MULTIMODAL_BRAND_TEXT:-}
      MULTIMODAL_BRAND_FONT: ${MULTIMODAL_BRAND_FONT:-DejaVu Sans}
      MULTIMODAL_BRAND_FONT_SIZE: ${MULTIMODAL_BRAND_FONT_SIZE:-28}
      FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
      FFPROBE_BIN: ${FFPROBE_BIN:-ffprobe}
      TIKTOK_CONTENT_POSTING_ENABLED: ${TIKTOK_CONTENT_POSTING_ENABLED:-false}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_API_BASE: ${TIKTOK_API_BASE:-https://open.tiktokapis.com}
      TIKTOK_PRIVACY_LEVEL: ${TIKTOK_PRIVACY_LEVEL:-SELF_ONLY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gf-prod

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: growth-flywheel-api:prod
    container_name: gf-prod-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://growth_user:${POSTGRES_PASSWORD}@postgres:5432/growth_flywheel
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    depends_on:
      - api
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gf-prod

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: growth-flywheel-api:prod
    container_name: gf-prod-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://growth_user:${POSTGRES_PASSWORD}@postgres:5432/growth_flywheel
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - gf-prod

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_qdrant_data:
  prod_minio_data:

networks:
  gf-prod:
    driver: bridge
