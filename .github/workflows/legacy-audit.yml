name: Legacy Repository Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  legacy-lint-audit:
    name: Legacy Lint Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.1.15
      - name: Audit repository lint debt
        run: |
          cd backend
          ruff check app/ tests/ --output-format=github

  legacy-test-audit:
    name: Legacy Test Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: growth_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_growth_flywheel
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U growth_user -d test_growth_flywheel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://growth_user:test_password@localhost:5433/test_growth_flywheel
      REDIS_URL: redis://localhost:6380/1
      JWT_SECRET: test-jwt-secret-key-for-testing-only-32-chars
      CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
      QWEN_API_KEY: test-key
      LANGCHAIN_API_KEY: test-key
      MINIO_ACCESS_KEY: test-minio-access
      MINIO_SECRET_KEY: test-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Audit existing test suite
        run: |
          cd backend
          pytest tests/ -v             --ignore=tests/test_e2e.py             --ignore=tests/test_agent_workflow_e2e.py             --ignore=tests/test_real_llm_connection.py             -x --tb=short -q --timeout=60
