name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          cd backend
          ruff check app/ tests/ --output-format=github

      - name: Run Black
        run: |
          cd backend
          black --check app/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: growth_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_growth_flywheel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U growth_user
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://growth_user:test_password@localhost:5432/test_growth_flywheel
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: test-jwt-secret-key-for-testing-only-32-chars
      CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
      QWEN_API_KEY: test-key
      LANGCHAIN_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt 2>/dev/null || pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --ignore=tests/test_e2e.py --ignore=tests/test_agent_workflow_e2e.py --ignore=tests/test_real_llm_connection.py -x --tb=short -q --timeout=60

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: growth-flywheel-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ops-smoke:
    name: Ops Scripts Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ops scripts
        run: |
          cd backend
          python scripts/ops/load_test.py --help
          python scripts/ops/fault_injection_startup.py --help
          python scripts/ops/slo_gate.py --help
