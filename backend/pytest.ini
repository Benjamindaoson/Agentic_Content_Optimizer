[pytest]
# Pytest 配置文件

# 测试目录
testpaths = tests

# Python 文件模式
python_files = test_*.py *_test.py

# Python 类模式
python_classes = Test*

# Python 函数模式
python_functions = test_*

# 最小 Python 版本
minversion = 7.0

# 添加选项
addopts =
    # 详细输出
    -v
    # 显示测试覆盖率
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # 并行运行测试
    -n auto
    # 显示最慢的 10 个测试
    --durations=10
    # 严格标记
    --strict-markers
    # 警告设置
    -W ignore::DeprecationWarning
    # 显示本地变量
    --showlocals
    # 失败时进入调试器（可选）
    # --pdb

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    rl: 强化学习相关测试
    rag: RAG 相关测试
    agent: Agent 相关测试
    api: API 相关测试
    db: 数据库相关测试

# 覆盖率配置
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
