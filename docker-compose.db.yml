version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: growth-flywheel-db
    environment:
      POSTGRES_USER: gf_user
      POSTGRES_PASSWORD: gf_password_2024
      POSTGRES_DB: growth_flywheel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gf_user -d growth_flywheel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: growth-flywheel-redis
    command: redis-server --requirepass gf_redis_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
