global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI 应用监控
  - job_name: 'growth-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'

  # Celery Worker 监控
  - job_name: 'celery-worker'
    static_configs:
      - targets: ['celery-worker:9090']

  # PostgreSQL 监控
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']

  # Redis 监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  # vLLM 监控
  - job_name: 'vllm'
    static_configs:
      - targets: ['vllm:8000']
    metrics_path: '/metrics'

  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
